name: Bug Report
description: Report a reproducible problem in the DASS software demonstration or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Report issues that can be reproduced in the repository. The current code is an offline synthetic device-health demonstration. Do not submit personal data, credentials, private file paths or sensitive information.
  - type: input
    id: file
    attributes:
      label: Affected file or component
      placeholder: "software/dass_telemetry_demo.py"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Runtime environment
      description: Include operating system and Python version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I checked existing issues for duplicates.
          required: true
        - label: I removed personal or sensitive information from this report.
          required: true
