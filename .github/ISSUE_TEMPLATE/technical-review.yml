name: Technical Review
description: Review DASS requirements, modular product architecture, software quality, or validation planning.
title: "[Technical Review]: "
body:
  - type: markdown
    attributes:
      value: |
        Please keep feedback within the DASS project scope: inert, non-functional training props; device management; enclosure design; serviceability; power management; software quality; privacy; and safe laboratory validation. Do not submit guidance for functional firearms, firing mechanisms, aiming, targeting, ballistic calculations, or recoil replication.
  - type: dropdown
    id: review_area
    attributes:
      label: Review area
      options:
        - Product requirements and system architecture
        - Enclosure, materials, and manufacturability
        - Modularity and serviceability
        - Power management and electronics integration
        - Device-health telemetry and software
        - Data privacy and security
        - Verification and validation
        - Cost and product feasibility
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version, commit, or file reviewed
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary of your review
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Technical reasoning or evidence
      description: Reference requirements, files, calculations, test conditions, or public literature.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation or open question
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Review checklist
      options:
        - label: I have kept this review within the repository's inert training-device and software scope.
          required: true
        - label: I have not included personal data, credentials, or sensitive operational information.
          required: true
