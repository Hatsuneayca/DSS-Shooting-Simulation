name: Research Feedback
description: Share academic feedback on methodology, validation, reproducibility, or references.
title: "[Research Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for research-oriented comments that can help make the project's assumptions, methods, and limitations clearer and more reproducible.
  - type: dropdown
    id: topic
    attributes:
      label: Feedback topic
      options:
        - Methodology
        - Numerical implementation
        - Validation design
        - Reproducibility
        - Model assumptions and limitations
        - References and related work
        - Other
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation or research question
      description: Describe the point you would like the project to consider.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Supporting rationale
      description: Explain why this matters and how it relates to the stated scope of the project.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence or suggested references
      description: Include citations, links, or reproducible observations where possible.
    validations:
      required: false
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducibility notes
      description: Include relevant environment details, assumptions, or steps needed to verify your observation.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: This feedback concerns the project's software, simulation, documentation, or research methodology.
          required: true
        - label: I have avoided including personal data, credentials, or sensitive operational information.
          required: true
