name: Research Feedback
description: Share academic feedback on DASS requirements, product design, verification, or feasibility.
title: "[Research Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for research-oriented comments on DASS as a modular training-device and device-management concept for dedicated inert, non-functional training props.
  - type: dropdown
    id: topic
    attributes:
      label: Feedback topic
      options:
        - Literature and comparable systems
        - Product requirements and architecture
        - Mechanical enclosure and materials
        - Modularity and serviceability
        - Power and electronics integration
        - Software and data management
        - Verification and validation
        - Cost and manufacturability
        - Privacy and responsible use
        - Other
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation or research question
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Supporting rationale
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence or references
      description: Include public papers, standards, supplier documentation, or reproducible software observations.
    validations:
      required: false
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducibility notes
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: This feedback concerns the inert training-device, software, product-design, or research scope.
          required: true
        - label: I have avoided personal data, credentials, and sensitive operational information.
          required: true
