name: Peer Review
description: Submit an independent review of DASS requirements, product design, software quality, validation, and feasibility.
title: "[Peer Review]: "
body:
  - type: markdown
    attributes:
      value: |
        Please assess a specific revision of DASS. The project scope is a modular device-management and training platform for dedicated inert, non-functional training props only.

        This public issue form is not a formal certification or confidential reporting channel. Do not submit personal data, credentials, private datasets or sensitive operational information. Do not include guidance for functional firearms, firing mechanisms, aiming, targeting, ballistic calculations or recoil replication.
  - type: input
    id: revision
    attributes:
      label: Reviewed version or commit
    validations:
      required: true
  - type: dropdown
    id: perspective
    attributes:
      label: Reviewer perspective
      options:
        - Mechanical or product design
        - Electronics and embedded systems
        - Software engineering
        - Manufacturing and maintenance
        - Research methods and validation
        - Cost and feasibility
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary review area
      options:
        - Requirements and architecture
        - Enclosure and serviceability
        - Electronics and power management
        - Software and data management
        - Verification and validation
        - Privacy and responsible use
        - Cost and manufacturability
        - Overall repository quality
    validations:
      required: true
  - type: dropdown
    id: assessment
    attributes:
      label: Overall assessment
      options:
        - Suitable for further development
        - Minor revisions recommended
        - Substantial revisions recommended
        - Unable to assess with available information
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Executive summary
    validations:
      required: true
  - type: textarea
    id: strengths
    attributes:
      label: Strengths
    validations:
      required: false
  - type: textarea
    id: major
    attributes:
      label: Major findings
      description: Cite requirement IDs, file paths or test IDs where possible.
    validations:
      required: false
  - type: textarea
    id: minor
    attributes:
      label: Minor findings
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and reproducibility
      description: Clearly identify synthetic data, analytical estimates and measured results.
    validations:
      required: false
  - type: textarea
    id: limitations
    attributes:
      label: Limitations of this review
    validations:
      required: false
  - type: checkboxes
    id: declarations
    attributes:
      label: Reviewer checklist
      options:
        - label: I identified the version or commit I reviewed.
          required: true
        - label: My review is within the stated inert training-device and software scope.
          required: true
        - label: I have not included personal data, credentials or sensitive operational information.
          required: true
        - label: I understand this public review is not a formal certification or endorsement.
          required: true
